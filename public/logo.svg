<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Hustle Time Calculator</title>
  <desc id="desc">Blue clock with motion lines and Hustle Time Calculator wordmark</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#315BD6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round">
