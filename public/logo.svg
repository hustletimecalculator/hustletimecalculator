    <path d="M25 68h28M16 90h37M25 112h28"/>
  </g>
  <text x="180" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#152033">Hustle Time</text>
  <text x="180" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#315BD6">Calculator</text>
